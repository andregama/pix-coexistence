<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Análise de Convivência</title>
  <style>
    :root {
      --bg: #f5f6f8; --panel: #ffffff; --border: #e2e5ea; --text: #1c2330;
      --muted: #6b7280; --accent: #2563eb; --a: #7c3aed; --b: #0ea5e9;
      --ok: #16a34a; --warn: #d97706; --err: #dc2626; --track: #eef1f5;
      --shadow: 0 1px 2px rgba(16,24,40,.06), 0 1px 3px rgba(16,24,40,.05);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0f141b; --panel: #171d26; --border: #263041; --text: #e6eaf0;
        --muted: #94a3b8; --accent: #3b82f6; --a: #a78bfa; --b: #38bdf8;
        --ok: #22c55e; --warn: #f59e0b; --err: #ef4444; --track: #202836;
        --shadow: none;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; background: var(--bg); color: var(--text);
      font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    header {
      display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between;
      padding: 18px 24px; border-bottom: 1px solid var(--border); background: var(--panel);
    }
    header h1 { font-size: 18px; margin: 0; font-weight: 650; letter-spacing: -.01em; }
    header .sub { color: var(--muted); font-size: 12px; margin-top: 2px; }
    .controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .controls label { color: var(--muted); font-size: 12px; }
    input[type="datetime-local"], input[type="url"], input[type="text"], select {
      background: var(--bg); color: var(--text); border: 1px solid var(--border);
      border-radius: 8px; padding: 6px 8px; font: inherit;
    }
    input[type="url"] { min-width: 230px; }
    button {
      background: var(--accent); color: #fff; border: 0; border-radius: 8px;
      padding: 7px 14px; font: inherit; font-weight: 600; cursor: pointer;
    }
    button.secondary { background: transparent; color: var(--accent); border: 1px solid var(--border); }
    button:active { transform: translateY(1px); }
    main { padding: 20px 24px 48px; max-width: 1200px; margin: 0 auto; }
    .apibar {
      display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
      padding: 10px 24px; background: var(--panel); border-bottom: 1px solid var(--border);
    }
    .apibar label { color: var(--muted); font-size: 12px; }
    .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 14px; }
    .tile {
      background: var(--panel); border: 1px solid var(--border); border-radius: 12px;
      padding: 16px 18px; box-shadow: var(--shadow);
    }
    .tile .k { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .04em; }
    .tile .v { font-size: 30px; font-weight: 680; margin-top: 6px; letter-spacing: -.02em; }
    .tile .d { font-size: 12px; color: var(--muted); margin-top: 4px; }
    .tile.accent-a { border-top: 3px solid var(--a); }
    .tile.accent-b { border-top: 3px solid var(--b); }
    .tile.accent-ok { border-top: 3px solid var(--ok); }
    .tile.accent-err { border-top: 3px solid var(--err); }
    .tile.accent-warn { border-top: 3px solid var(--warn); }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 18px; margin-top: 18px; }
    .panel {
      background: var(--panel); border: 1px solid var(--border); border-radius: 12px;
      padding: 18px; box-shadow: var(--shadow);
    }
    .panel h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 0 0 14px; font-weight: 650; }
    .funnel-row { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
    .funnel-row .lbl { width: 130px; font-size: 13px; flex-shrink: 0; }
    .funnel-row .barwrap { flex: 1; background: var(--track); border-radius: 6px; height: 26px; overflow: hidden; }
    .funnel-row .bar { height: 100%; border-radius: 6px; display: flex; align-items: center; padding-left: 8px; color: #fff; font-size: 12px; font-weight: 600; min-width: 2px; transition: width .4s ease; }
    .funnel-row .pct { width: 52px; text-align: right; color: var(--muted); font-size: 12px; flex-shrink: 0; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th, td { text-align: left; padding: 7px 8px; border-bottom: 1px solid var(--border); }
    th { color: var(--muted); font-weight: 600; font-size: 11px; text-transform: uppercase; letter-spacing: .03em; }
    td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
    .minibar { height: 6px; border-radius: 3px; background: var(--accent); }
    .badge { display: inline-block; padding: 1px 7px; border-radius: 999px; font-size: 11px; font-weight: 600; }
    .badge.err { background: color-mix(in srgb, var(--err) 16%, transparent); color: var(--err); }
    .badge.a { background: color-mix(in srgb, var(--a) 18%, transparent); color: var(--a); }
    .badge.b { background: color-mix(in srgb, var(--b) 18%, transparent); color: var(--b); }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; }
    .empty { color: var(--muted); font-size: 13px; padding: 8px 0; }
    #status { font-size: 12px; color: var(--muted); }
    #status.error { color: var(--err); }
    .truncate { max-width: 220px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>Análise de Convivência</h1>
      <div class="sub"><span id="replLabel"></span> · <span id="status">carregando…</span></div>
    </div>
    <div class="controls">
      <label>De <input type="datetime-local" id="from" /></label>
      <label>Até <input type="datetime-local" id="to" /></label>
      <label>Auto
        <select id="auto">
          <option value="0">desligado</option>
          <option value="15" selected>15s</option>
          <option value="30">30s</option>
          <option value="60">60s</option>
        </select>
      </label>
      <button class="secondary" id="clear">Limpar período</button>
      <button id="refresh">Atualizar</button>
    </div>
  </header>

  <div class="apibar">
    <label for="apiBase">URL base da API</label>
    <input type="url" id="apiBase" placeholder="http://localhost:5152" spellcheck="false" />
    <span style="width:1px;height:22px;background:var(--border)"></span>
    <label for="nameA">Nome do Sistema A</label>
    <input type="text" id="nameA" placeholder="Sistema A" spellcheck="false" style="min-width:130px" />
    <label for="nameB">Nome do Sistema B</label>
    <input type="text" id="nameB" placeholder="Sistema B" spellcheck="false" style="min-width:130px" />
    <button class="secondary" id="saveSettings">Salvar e recarregar</button>
    <span id="apiHint" class="sub" style="color:var(--muted)"></span>
  </div>

  <main>
    <section class="tiles" id="tiles"></section>

    <div class="grid">
      <div class="panel">
        <h2>Funil de replicação (entrada SPI→PSP)</h2>
        <div id="funnel"></div>
      </div>
      <div class="panel">
        <h2>Tempos de replicação</h2>
        <div id="latency"></div>
      </div>
      <div class="panel">
        <h2>Entrada por tipo de mensagem</h2>
        <div id="bytype"></div>
      </div>
      <div class="panel">
        <h2>Saída por tipo de mensagem</h2>
        <div id="outbytype"></div>
      </div>
      <div class="panel">
        <h2>Origem da correlação (RF-05)</h2>
        <div id="correlation"></div>
      </div>
      <div class="panel">
        <h2>Divergências por campo</h2>
        <div id="discrepancies"></div>
      </div>
    </div>

    <div class="grid">
      <div class="panel" style="grid-column: 1 / -1;">
        <h2>Erros recentes</h2>
        <div id="errors"></div>
      </div>
    </div>
  </main>

  <script>
    const $ = (id) => document.getElementById(id);
    const LOCALE = "pt-BR";
    const fmt = (n) => (n ?? 0).toLocaleString(LOCALE);
    // Localized percentage string (pt-BR decimal comma), e.g. "96,6".
    const pct = (n, d) => (d > 0 ? Math.round((n / d) * 1000) / 10 : 0).toLocaleString(LOCALE, { maximumFractionDigits: 1 });
    const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    // Humanise a millisecond duration into pt-BR "ms" / "s" / "min".
    const dur = (ms) => {
      if (ms == null) return "—";
      if (ms < 1000) return `${Math.round(ms)} ms`;
      if (ms < 60000) return `${(ms / 1000).toLocaleString(LOCALE, { maximumFractionDigits: 1 })} s`;
      return `${(ms / 60000).toLocaleString(LOCALE, { maximumFractionDigits: 1 })} min`;
    };

    // --- Settings: configurable, persisted per-browser ---------------------------------------
    const API_KEY = "coex.analytics.apiBase";
    const NAME_A_KEY = "coex.analytics.nameA";
    const NAME_B_KEY = "coex.analytics.nameB";
    const DEFAULT_API = "http://localhost:5152";
    const DEFAULT_NAME_A = "Sistema A";
    const DEFAULT_NAME_B = "Sistema B";
    function lsGet(key, fallback) { try { return localStorage.getItem(key) || fallback; } catch { return fallback; } }
    function getApiBase() {
      const fromQuery = new URLSearchParams(location.search).get("api");
      if (fromQuery) { try { localStorage.setItem(API_KEY, fromQuery); } catch {} return fromQuery; }
      return lsGet(API_KEY, DEFAULT_API).replace(/\/+$/, "");
    }
    // Display names for System A / System B, used everywhere in the UI.
    const nameA = () => lsGet(NAME_A_KEY, DEFAULT_NAME_A);
    const nameB = () => lsGet(NAME_B_KEY, DEFAULT_NAME_B);
    // Map an API system code ("A"/"B") to its configured display name.
    const sysName = (code) => code === "A" ? nameA() : code === "B" ? nameB() : code;

    let timer = null;

    function renderTiles(s) {
      const inb = s.inbound, err = s.errors;
      const A = nameA(), B = nameB();
      const totalErrors = err.inboundSystemAErrors + err.inboundSystemBErrors +
        err.outboundSystemAErrors + err.outboundSystemBErrors;
      const tiles = [
        { k: `Recebidas de ${A}`, v: inb.receivedFromA, cls: "accent-a", d: `mensagens de entrada vistas em ${A}` },
        { k: `Propagadas ${A}→${B}`, v: inb.propagatedToB, cls: "accent-b", d: pct(inb.propagatedToB, inb.receivedFromA) + "% das recebidas" },
        { k: `Consumidas por ${B}`, v: inb.consumedByB, cls: "accent-ok", d: pct(inb.consumedByB, inb.propagatedToB) + "% das propagadas" },
        { k: "Aguardando consumo", v: inb.awaitingConsumption, cls: "accent-warn", d: "assinadas, ainda sem confirmação" },
        { k: "Lacuna de propagação", v: inb.propagationGap, cls: "accent-warn", d: `em ${A}, nunca enviadas para ${B}` },
        { k: "Erros", v: totalErrors, cls: "accent-err", d: fmt(err.discrepancies) + " divergências" },
      ];
      $("tiles").innerHTML = tiles.map(t =>
        `<div class="tile ${t.cls}"><div class="k">${esc(t.k)}</div><div class="v">${fmt(t.v)}</div><div class="d">${esc(t.d)}</div></div>`
      ).join("");
    }

    function renderFunnel(s) {
      const inb = s.inbound;
      const base = Math.max(inb.receivedFromA, 1);
      const rows = [
        { lbl: `Recebidas (${nameA()})`, val: inb.receivedFromA, color: "var(--a)" },
        { lbl: `Propagadas (${nameB()})`, val: inb.propagatedToB, color: "var(--b)" },
        { lbl: `Consumidas (${nameB()})`, val: inb.consumedByB, color: "var(--ok)" },
      ];
      $("funnel").innerHTML = rows.map(r => {
        const w = Math.max((r.val / base) * 100, r.val > 0 ? 2 : 0);
        return `<div class="funnel-row">
          <div class="lbl">${esc(r.lbl)}</div>
          <div class="barwrap"><div class="bar" style="width:${w}%;background:${r.color}">${fmt(r.val)}</div></div>
          <div class="pct">${pct(r.val, base)}%</div>
        </div>`;
      }).join("");
    }

    function renderLabelCounts(elId, items, colorVar) {
      const el = $(elId);
      if (!items || items.length === 0) { el.innerHTML = `<div class="empty">Sem dados no período.</div>`; return; }
      const max = Math.max(...items.map(i => i.count), 1);
      el.innerHTML = `<table><tbody>${items.map(i => `
        <tr>
          <td class="truncate mono">${esc(i.label)}</td>
          <td style="width:45%"><div class="minibar" style="width:${(i.count / max) * 100}%;background:${colorVar}"></div></td>
          <td class="num">${fmt(i.count)}</td>
        </tr>`).join("")}</tbody></table>`;
    }

    function renderByType(s) {
      const items = s.byMsgType;
      const el = $("bytype");
      if (!items || items.length === 0) { el.innerHTML = `<div class="empty">Sem dados no período.</div>`; return; }
      el.innerHTML = `<table>
        <thead><tr><th>Tipo</th><th class="num">Receb. ${esc(nameA())}</th><th class="num">Prop. ${esc(nameB())}</th><th class="num">Cons. ${esc(nameB())}</th></tr></thead>
        <tbody>${items.map(t => `
          <tr>
            <td class="mono">${esc(t.msgType)}</td>
            <td class="num">${fmt(t.receivedFromA)}</td>
            <td class="num">${fmt(t.propagatedToB)}</td>
            <td class="num">${fmt(t.consumedByB)}</td>
          </tr>`).join("")}</tbody></table>`;
    }

    // Outbound (PSP→SPI) sent/correlated counts per message type — surfaces trck.002.
    function renderOutByType(s) {
      const items = s.outboundByMsgType;
      const el = $("outbytype");
      if (!items || items.length === 0) { el.innerHTML = `<div class="empty">Sem dados no período.</div>`; return; }
      el.innerHTML = `<table>
        <thead><tr><th>Tipo</th><th class="num">Total</th><th class="num">Correlacionadas</th></tr></thead>
        <tbody>${items.map(t => {
          const hi = t.msgType === "trck.002" ? ' style="font-weight:600"' : "";
          return `<tr${hi}>
            <td class="mono">${esc(t.msgType)}</td>
            <td class="num">${fmt(t.total)}</td>
            <td class="num">${fmt(t.correlated)}</td>
          </tr>`;
        }).join("")}</tbody></table>`;
    }

    // Replication timing: end-to-end (inbound) and A↔B correlation (outbound).
    function renderLatency(s) {
      const lat = s.latency;
      const el = $("latency");
      const rows = [
        { lbl: "Ponta a ponta (entrada)", st: lat && lat.inboundEndToEnd },
        { lbl: "Correlação A↔B (saída)", st: lat && lat.outboundCorrelation },
      ];
      const anySamples = rows.some(r => r.st && r.st.count > 0);
      if (!anySamples) { el.innerHTML = `<div class="empty">Sem medições no período.</div>`; return; }
      el.innerHTML = `<table>
        <thead><tr><th>Etapa</th><th class="num">Amostras</th><th class="num">Média</th><th class="num">p50</th><th class="num">p95</th><th class="num">Máx</th></tr></thead>
        <tbody>${rows.map(r => {
          const st = r.st || { count: 0, avgMs: 0, p50Ms: 0, p95Ms: 0, maxMs: 0 };
          const empty = st.count === 0;
          return `<tr>
            <td>${esc(r.lbl)}</td>
            <td class="num">${fmt(st.count)}</td>
            <td class="num">${empty ? "—" : dur(st.avgMs)}</td>
            <td class="num">${empty ? "—" : dur(st.p50Ms)}</td>
            <td class="num">${empty ? "—" : dur(st.p95Ms)}</td>
            <td class="num">${empty ? "—" : dur(st.maxMs)}</td>
          </tr>`;
        }).join("")}</tbody></table>`;
    }

    const dirLabel = (d) => d === "Inbound" ? "Entrada" : d === "Outbound" ? "Saída" : d;

    function renderErrors(s) {
      const items = s.recentErrors;
      const el = $("errors");
      if (!items || items.length === 0) { el.innerHTML = `<div class="empty">Sem erros no período. 🎉</div>`; return; }
      el.innerHTML = `<table>
        <thead><tr><th>Quando (UTC)</th><th>Direção</th><th>Sistema</th><th>Tipo</th><th>Id idempotente</th><th>Erro</th></tr></thead>
        <tbody>${items.map(e => `
          <tr>
            <td class="mono">${esc(new Date(e.at).toISOString().replace("T", " ").slice(0, 19))}</td>
            <td>${esc(dirLabel(e.direction))}</td>
            <td><span class="badge ${e.system === "A" ? "a" : "b"}">${esc(sysName(e.system))}</span></td>
            <td class="mono">${esc(e.msgType)}</td>
            <td class="mono truncate">${esc(e.idempotentId)}</td>
            <td><span class="badge err truncate" style="max-width:280px">${esc(e.errorCode)}</span></td>
          </tr>`).join("")}</tbody></table>`;
    }

    function toUtcParam(localValue) {
      if (!localValue) return null;
      // datetime-local is local time; convert to a UTC ISO string for the API.
      return new Date(localValue).toISOString();
    }

    async function load() {
      const status = $("status");
      const apiBase = getApiBase();
      status.className = "";
      status.textContent = "atualizando…";
      const params = new URLSearchParams();
      const from = toUtcParam($("from").value);
      const to = toUtcParam($("to").value);
      if (from) params.set("from", from);
      if (to) params.set("to", to);
      try {
        const res = await fetch(`${apiBase}/api/v1/analytics/summary?${params.toString()}`, { headers: { Accept: "application/json" } });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const s = await res.json();
        renderTiles(s);
        renderFunnel(s);
        renderLatency(s);
        renderByType(s);
        renderOutByType(s);
        renderLabelCounts("correlation", s.correlationSource, "var(--accent)");
        renderLabelCounts("discrepancies", s.discrepanciesByField, "var(--err)");
        renderErrors(s);
        status.textContent = "atualizado às " + new Date().toLocaleTimeString(LOCALE);
      } catch (e) {
        status.className = "error";
        status.textContent = `falha ao carregar de ${apiBase}: ${e.message}`;
      }
    }

    function scheduleAuto() {
      if (timer) { clearInterval(timer); timer = null; }
      const secs = parseInt($("auto").value, 10);
      if (secs > 0) timer = setInterval(load, secs * 1000);
    }

    // Reflect the configured names into all static (non-data) labels.
    function applyStaticLabels() {
      $("replLabel").textContent = `Replicação ${nameA()} → ${nameB()}`;
      document.title = "Análise de Convivência";
    }

    // Wire settings inputs (API base URL + System A/B names).
    $("apiBase").value = getApiBase();
    $("nameA").value = nameA();
    $("nameB").value = nameB();
    $("apiHint").textContent = `padrões: ${DEFAULT_API} · ${DEFAULT_NAME_A} · ${DEFAULT_NAME_B}`;
    function saveSettings() {
      const api = $("apiBase").value.trim().replace(/\/+$/, "");
      const a = $("nameA").value.trim();
      const b = $("nameB").value.trim();
      try {
        localStorage.setItem(API_KEY, api || DEFAULT_API);
        localStorage.setItem(NAME_A_KEY, a || DEFAULT_NAME_A);
        localStorage.setItem(NAME_B_KEY, b || DEFAULT_NAME_B);
      } catch {}
      applyStaticLabels();
      load();
    }
    $("saveSettings").addEventListener("click", saveSettings);
    ["apiBase", "nameA", "nameB"].forEach(id =>
      $(id).addEventListener("keydown", (e) => { if (e.key === "Enter") saveSettings(); }));

    applyStaticLabels();
    $("refresh").addEventListener("click", load);
    $("clear").addEventListener("click", () => { $("from").value = ""; $("to").value = ""; load(); });
    $("auto").addEventListener("change", scheduleAuto);
    ["from", "to"].forEach(id => $(id).addEventListener("change", load));

    load();
    scheduleAuto();
  </script>
</body>
</html>
