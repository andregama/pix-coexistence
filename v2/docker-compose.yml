# Local infrastructure for the v2 coexistence proxy. Independent from the root docker-compose.yml:
# its own project name, containers, volumes and host ports, so both stacks can run side by side.
name: convivencia-v2

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: convivencia-v2-sqlserver
    environment:
      SA_PASSWORD: "${SA_PASSWORD:-Dev@Strong123}"
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
    ports:
      - "14330:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "${SA_PASSWORD:-Dev@Strong123}" -Q "SELECT 1" -C -b
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # Only carries wake-up notifications for long-polling pull streams; it stores nothing.
  redis:
    image: redis:7-alpine
    container_name: convivencia-v2-redis
    command: redis-server --save ""
    ports:
      - "6380:6379"
    healthcheck:
      test: redis-cli ping
      interval: 5s
      timeout: 3s
      retries: 10

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    container_name: convivencia-v2-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    healthcheck:
      test: nc -z localhost 2181
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  # Audit events only — the message path does not depend on Kafka.
  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: convivencia-v2-kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9193:9193"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:9193
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:9193
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    healthcheck:
      test: kafka-topics --bootstrap-server localhost:9092 --list
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  kafka-init:
    image: confluentinc/cp-kafka:7.6.1
    container_name: convivencia-v2-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command: |
      "
      kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic v2.spi.audit.sent --partitions 3 --replication-factor 1
      kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic v2.spi.audit.received --partitions 3 --replication-factor 1
      echo 'Topics created.'
      "

  jaeger:
    image: jaegertracing/all-in-one:1.57
    container_name: convivencia-v2-jaeger
    ports:
      - "16687:16686"  # UI
      - "4327:4317"    # OTLP gRPC

volumes:
  sqlserver-data:
